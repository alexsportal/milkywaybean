<style>

.section1 {
    display: flex;
    flex-direction: row;
    margin: auto;
    position: relative;
    width: 100%;
    gap: 26px;
    flex-wrap: wrap;
    justify-content: center;
    height: calc(100dvh - 280px);
    margin-bottom:50px;
}

.section1 .container {
    flex: 1 1 500px;
    margin-top: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0;
    overflow: hidden;
    position: relative;
}

.section1 .container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
}

.section1 .caption {
    position: relative;
    z-index: 10;
    padding: 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
    color: white;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

@media screen and (max-width: 1026px) and (max-height:601px) {
    .section1 {
        height: calc(100dvh - 243px);
    }
}


@media screen and (max-width: 1025px) and (max-height:1367px) {
    .section1 {
        height: calc(100dvh - 243px);
    }
}


@media screen and (max-width: 431px) {
    .section1 {
       height:75vh;
    }
}

@media screen and (max-width: 391px) {
    .section1 {
       height:73vh;
    }
}
</style>
</head>
