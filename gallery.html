<style>


.gallerycontainer{
    box-shadow: 6px 6px 0px #c0bae1;
}

.galleryitem {
    margin: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    width: calc(25% - 15px);
}

.galleryimg {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    cursor: pointer;
    border-radius: 10px;
    transition: ease .3s;
}

.gallerytitle {
    font-size: 16px;
    margin: 8px 0 2px 0;
    line-height: normal;
    text-align: center;
}

.galleryinfo {
    margin: 0 0 4px 0;
    line-height: normal;
    text-align: center;
    font-size: 12px;
}

#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    cursor: pointer;
}

#lightboximg {
    max-width: 90%;
    max-height: 80%;
    border-radius: 10px;
}

#lightboxcaption {
    text-align: center;
    color: white;
}

#lightboxcaption h3 {
    font-size: 18px;
    color: white;
}

#lightboxcaption p {
    margin: 0;
    margin-top:25px;
    color: rgba(255,255,255,0.75);
}

@media screen and (max-width: 614px) {
    .galleryitem {
        width: calc(50% - 10px);
    }
}
</style>
</head>
